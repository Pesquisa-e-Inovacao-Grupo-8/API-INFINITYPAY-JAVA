# Nome da aplicacao
spring.application.name=payment-microservice

# Porta em que o microservico vai rodar
server.port=8088

# ==========================================
# INTEGRACOES EXTERNAS (Valores Provisorios)
# ==========================================

# URL do Backend (o principal que roda na porta 8080)
api.core.url=http://localhost:8080

# Chave de seguranca para comunicar com o Backend
spring.api.key=CHAVE_DO_SPRING

# Chave de acesso da Infinity Pay
infinity.api.key=CHAVE_DA_INFINITY_PAY