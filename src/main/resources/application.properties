# Nome da aplicacao
spring.application.name=payment-microservice

# Porta em que o microservico vai rodar
server.port=8088

# ==========================================
# INTEGRACOES EXTERNAS
# ==========================================

# URL do Backend (o principal que roda na porta 8080)
api.core.url=http://back-end-java:8080

# Chave de seguranca para comunicar com o Backend
spring.api.key=${API_SPRING_KEY:CHAVE_PROVISORIA_DO_SPRING}

# Handle publico da Infinity Pay
infinity.pay.handle=${INFINITY_PAY_HANDLE:alexsander-torres}